# Preset medium (43M) — o carro-chefe do paper (seção 8).
# Camada de config real (YAML): centraliza hiperparâmetros em vez de hardcode.
model:
  preset: medium        # d=512, L=12, H=8
  vocab_size: 8192
  context_len: 512
  rope_base: 10000.0
  dropout: 0.1

train:
  lr_max: 3.0e-4
  lr_min_ratio: 0.1
  weight_decay: 0.1
  betas: [0.9, 0.999]
  warmup_cap: 2000
  grad_clip: 1.0
  grad_accum: 1
  max_epochs: 20
  patience: 4
  batch_size: 16
  use_bf16: true

data:
  corpus_path: data/corpus.jsonl
  tokens_cache: data/corpus_tokens.pt
  stride: null          # null => chunked (stride = context_len)
